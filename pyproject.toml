[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depbot"
version = "0.1.0"
description = "Fleet-wide, evidence-backed C++ dependency migration"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5,<3",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
depbot = "depbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: exercises several modules together",
    "e2e: runs real conan/cmake/ctest commands",
]
